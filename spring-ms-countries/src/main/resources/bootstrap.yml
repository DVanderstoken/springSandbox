spring:

  cloud:
    config:
      fail-fast: true
      discovery:
        enabled: true
        serviceId: SPRING-CLOUD-CONFIG-SERVER

  cache:
    caffeine:
     spec: maximumSize=500,expireAfterAccess=120s

eureka:
  client:
    region: dev.gnc
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://spring-cloud-netflix-eureka-peer2:10301/eureka/,http://spring-cloud-netflix-eureka-peer1:10300/eureka/
    fetch-registry: true
    healthcheck:
      enabled: true