spring:
  application:
    name: geolocation
  boot:
    admin:
      client:
        url:
        - http://spring-boot-admin:10100
        
  flyway:
    enabled: true
        
  jpa: 
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.HSQLDialect
 
  datasource:
    url: jdbc:hsqldb:mem:testdb
    driverClassName: org.hsqldb.jdbcDriver
    username: sa
    password:
  data:
    rest:
      base-path: /api

  sql:
    init:
      platform: hsqldb

  cloud:
    config:
      fail-fast: true
      discovery:
        enabled: true
        serviceId: SPRING-CLOUD-CONFIG-SERVER

  cache:
    caffeine:
     spec: maximumSize=500,expireAfterAccess=120s
      
management:
  endpoints:
    web:
      exposure:
        include: "*"
  
logging:
  file: 
    path: "/var/log"
    name: ${spring.application.name}.log
  level:
    root: INFO 
   
server:
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
  forward-headers-strategy: none

